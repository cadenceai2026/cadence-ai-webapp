<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting Strava… — Cadence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Space+Grotesk:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
    <div class="auth-card" style="text-align:center;max-width:400px">
      <div class="brand">Ca<span>den</span>ce</div>
      <div style="font-size:2.5rem;margin-bottom:16px">🔗</div>
      <h2 id="callback-title" style="margin-bottom:8px">Connecting Strava…</h2>
      <p id="callback-status" style="color:var(--muted);font-size:0.88rem">Processing authorization…</p>
      <pre id="callback-error" style="display:none;margin-top:16px;padding:12px;background:rgba(255,60,60,.08);border:1px solid rgba(255,60,60,.3);border-radius:8px;font-size:0.78rem;color:#ff6b6b;text-align:left;white-space:pre-wrap;word-break:break-all"></pre>
      <div id="callback-spinner" style="margin-top:20px">
        <div class="spinner"></div>
      </div>
      <a id="callback-back" href="./app.html" style="display:none;margin-top:20px;font-size:0.85rem;color:var(--muted)">← Volver a la app</a>
    </div>
  </div>

  <script type="module">
    // Use a dedicated client with detectSessionInUrl:false so the Supabase SDK
    // doesn't mistake Strava's ?code= param for a Supabase PKCE code, which
    // would cause it to clear the stored session before we can read it.
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    import { CONFIG } from './js/config.js';
    const supabase = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
      auth: { detectSessionInUrl: false }
    });

    function showError(title, detail) {
      document.getElementById('callback-title').textContent = title;
      document.getElementById('callback-status').textContent = '';
      document.getElementById('callback-spinner').style.display = 'none';
      document.getElementById('callback-back').style.display = 'inline-block';
      const pre = document.getElementById('callback-error');
      pre.style.display = 'block';
      pre.textContent = detail || '(sin detalle)';
      console.error('[strava-callback]', title, detail);
    }

    async function run() {
      const status = document.getElementById('callback-status');
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const urlError = params.get('error');

      if (urlError) {
        showError('Autorización denegada', `Strava devolvió: ${urlError}`);
        return;
      }

      if (!code) {
        showError('Sin código de autorización', 'No se encontró el parámetro ?code= en la URL.');
        return;
      }

      const { data: sessionData } = await supabase.auth.getSession();
      if (!sessionData?.session) {
        showError('No estás autenticado', 'No hay sesión activa. Inicia sesión en la app y vuelve a intentarlo.');
        return;
      }

      status.textContent = 'Exchanging authorization code…';

      const { data, error: fnError } = await supabase.functions.invoke('exchange-strava-code', {
        body: { code, redirectUri: `${window.location.origin}/strava-callback.html` },
        headers: { Authorization: `Bearer ${sessionData.session.access_token}` }
      });

      if (fnError || !data?.ok) {
        let detail = data?.error ?? null;
        if (data?.details) {
          try { detail += '\n' + JSON.stringify(data.details, null, 2); } catch {}
        }
        try {
          if (!detail && fnError?.context) {
            const body = await fnError.context.json();
            detail = body?.error ?? body?.message ?? JSON.stringify(body, null, 2);
          }
        } catch {}
        if (!detail && fnError) detail = String(fnError);
        showError('Error al conectar Strava', detail ?? 'Error desconocido');
        return;
      }

      status.textContent = 'Strava connected! Redirecting…';
      document.getElementById('callback-spinner').style.display = 'none';
      setTimeout(() => window.location.href = './app.html?strava=connected', 1000);
    }

    run();
  </script>
</body>
</html>
