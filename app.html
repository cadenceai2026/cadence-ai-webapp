<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadence App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body data-page="auth">

  <!-- AUTH -->
  <section class="auth">
    <h1>Welcome back</h1>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button id="login">Sign in</button>
  </section>

  <!-- APP -->
  <section class="dashboard">
    <aside class="sidebar">
      <h2>Cadence</h2>
      <nav>
        <button data-route="dashboard">Dashboard</button>
        <button data-route="activities">Activities</button>
        <button data-route="groups">Groups</button>
        <button data-route="settings">Settings</button>
      </nav>
      <button id="logout">Logout</button>
    </aside>

    <main class="content" id="view">
      <h1>Dashboard</h1>
      <p>Loading…</p>
    </main>
  </section>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
